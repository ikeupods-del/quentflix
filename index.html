<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Quentflix — Netflix ailleurs en Europe</title>
    <meta name="description" content="Séries et films absents de Netflix France mais disponibles en Italie, Belgique ou Suisse." />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">Quent<span>flix</span></h1>
      <form class="search" role="search" id="search-form">
        <label class="sr-only" for="q">Rechercher un titre</label>
        <input id="q" type="search" placeholder="Rechercher un film ou une série…"
               autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
      </form>
    </header>

    <main>
      <section class="tonight" aria-label="Que regarder ce soir ?">
        <button type="button" id="tonight-toggle" class="btn" aria-expanded="false">🎲 Que regarder ce soir ?</button>
        <div id="tonight-panel" hidden>
          <label>Quoi ? <select id="t-type"><option value="">Film ou série</option><option value="movie">Film</option><option value="series">Série</option></select></label>
          <label>Où ? <select id="t-country"><option value="">Peu importe</option><option value="IT">Italie</option><option value="BE">Belgique</option><option value="CH">Suisse</option></select></label>
          <button type="button" id="t-go" class="btn primary">Proposer</button>
          <ul id="t-result" class="results" aria-live="polite"></ul>
          <div id="t-actions" hidden>
            <button type="button" id="t-other" class="btn">Un autre</button>
            <button type="button" id="t-seen" class="btn">Déjà vu</button>
          </div>
        </div>
      </section>
      <p id="notice" class="notice" hidden></p>
      <p id="status" class="status" aria-live="polite"></p>
      <ul id="results" class="results" aria-label="Résultats de recherche" aria-live="polite"></ul>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
